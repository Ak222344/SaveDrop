<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water Saver App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f0fdf4;
    }
    h1, h2 {
      color: #15803d;
    }
    label, select, button {
      display: block;
      margin-top: 15px;
    }
    #results {
      margin-top: 30px;
      padding: 20px;
      background-color: #e0f7e9;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>🏠 Water Saver Upgrade Tool</h1>
  <p>Select your appliance and see upgrade suggestions!</p>

  <label for="appliance">Choose an appliance:</label>
  <select id="appliance">
    <option value="toilet">Toilet</option>
    <option value="showerhead">Showerhead</option>
    <option value="washing_machine">Washing Machine</option>
  </select>

  <label for="age">Approximate age (years):</label>
  <select id="age">
    <option value="1">1-3</option>
    <option value="4">4-6</option>
    <option value="7">7+</option>
  </select>

  <button onclick="assessAppliance()">Assess</button>

  <div id="results">
    <h2>🔍 Assessment Results</h2>
    <p id="current"></p>
    <p id="recommendation"></p>
    <p id="savings"></p>
  </div>

  <script>
    const mockData = {
      toilet: {
        old: { waterUse: 6, rating: "⚠️ Inefficient" },
        upgrade: { model: "Toto Eco", waterUse: 1.28, savings: 70 }
      },
      showerhead: {
        old: { waterUse: 5, rating: "⚠️ High Flow" },
        upgrade: { model: "Niagara Earth", waterUse: 1.5, savings: 60 }
      },
      washing_machine: {
        old: { waterUse: 40, rating: "❌ Outdated Top Load" },
        upgrade: { model: "LG HE", waterUse: 15, savings: 100 }
      }
    };

    function assessAppliance() {
      const appliance = document.getElementById("appliance").value;
      const age = parseInt(document.getElementById("age").value);
      const resultDiv = document.getElementById("results");

      const data = mockData[appliance];
      const current = data.old;
      const upgrade = data.upgrade;

      let comment = age > 6 ? current.rating : "✅ Modern Enough";

      document.getElementById("current").innerText = `Your ${appliance.replace('_', ' ')} is using ~${current.waterUse} gallons/use. Status: ${comment}`;
      document.getElementById("recommendation").innerText = `Recommended upgrade: ${upgrade.model} (${upgrade.waterUse} gallons/use)`;
      document.getElementById("savings").innerText = `Estimated yearly savings: ~$${upgrade.savings}`;

      resultDiv.style.display = "block";
    }
  </script>
</body>
</html>
