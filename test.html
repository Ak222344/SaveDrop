<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login / Signup</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea, #764ba2);
      height: 100vh;
      color: #333;
    }

    /* Wrapper just for centering login/signup */
    #authContainerWrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      transition: all 0.3s ease;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 10px;
      transition: border 0.2s;
    }

    input:focus {
      border-color: #764ba2;
      outline: none;
    }

    .user {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: linear-gradient(to right, #667eea, #764ba2);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: linear-gradient(to right, #5a67d8, #6b46c1);
    }

    .switch {
      text-align: center;
      margin-top: 15px;
      color: #764ba2;
      cursor: pointer;
      font-size: 14px;
    }

    .switch:hover {
      text-decoration: underline;
    }

    #homePage {
      display: none;
      height: 100vh;
    }

    .navbar {
      display: flex;
      flex-direction: row;
      gap: 10px;
      padding: 15px;
      position: absolute;
      top: 0;
      left: 0;
      border-bottom: black 1px solid;
      width: 100%;
      justify-content: space-between;
    }

    .btn-3d {
  padding: 10px 20px;
  max-width: min-content;
  font-size: 16px;
  font-weight: 600;
  background-color: white; /* Change the background color to white */
  color: #333;
  border: 2px solid #ccc;
  border-right: 3px solid black;
  border-bottom: 3px solid black;
  border-top: 2px solid #ccc;
  border-left: 2px solid #ccc;
  border-radius: 6px;
  cursor: pointer;
  box-shadow: 1px 1px 0px #999;
  transition: transform 0.1s ease, box-shadow 0.1s ease;
}

.btn-3d:active {
  transform: translate(2px, 2px);
  box-shadow: none;
}

body {
      font-family: 'Arial Rounded MT Bold', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fff;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      border-bottom: 1px solid #ccc;
    }
    .value-boxes button {
      width: 150px;
      height: 35px;
      margin-right: 10px;
      border-radius: 5px;
      border: 1px solid #000;
      box-shadow: 3px 3px #000;
      background-color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: default;
    }

    .value-boxes-2{

        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 20px;
        right: 20px;

    .score{

      width: 150px;

      margin-right: 10px;
      border-radius: 5px;

      box-shadow: 3px 3px #000;
      background-color: #fff;

    }
    .play-button {

      border: none;

      display: flex;

    }
    .main-content {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      margin-top: 50px;

    }
    .leaderboard {
      background-color: #467a9d;
      color: white;
      font-size: 44px;
      font-weight: bold;
      padding: 50px;
      border-radius: 25px;
      //background-image: repeating-linear-gradient(45deg, #467a9d, #467a9d 20px, #4e87ac 20px, #4e87ac 40px);
      text-align: center;
      margin-bottom: 20px;
    }
    .trophy {
      font-size: 60px;

    }
    .challenges {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 30px;
    }
    .challenge-box {
      width: 200px;
      height: 250px;
      border: 1px solid black;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }
    .challenge-title {
      font-weight: bold;
      font-size: 20px;
    }
    .start-button {
      background-color: #005ca8;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 8px 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .divider {
      width: 100%;
      height: 2px;
      margin-top: 10px;
    }
    .divider.blue { background-color: #6666cc; }
    .divider.green { background-color: #2dc937; }

  </style>
</head>
<body>

  <!-- Centered login/signup container -->
  <div id="authContainerWrapper">
    <div class="container" id="authContainer">
      <h2 id="formTitle">Login</h2>
      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />
      <button class="user" onclick="handleAuth()">Login</button>
      <div class="switch" onclick="toggleForm()">Don't have an account? Sign up</div>
    </div>
  </div>

  <!-- Hidden Home Page -->
  <div id="homePage">
    <!-- Top-left navbar -->

      <div class="header">

        <div class="value-boxes">
          <button id="displayUser"></button>
          <button id="btn-3d" onclick="logout()">Logout</button>
        </div>

        <div class="value-boxes-2">

            <button class="score">Score:</button>
            <button class="play-button" onclick="play()">PLAY <span>&raquo;</span></button>

        </div>

      </div>

      <div class="main-content">
        <div class="leaderboard">Leaderboard</div>
        <div class="challenges">
          <div class="challenge-box">
            <div class="challenge-title">Weekly Challenge</div>
            <div class="divider blue"></div>
            <button class="start-button">START</button>
          </div>
          <div class="challenge-box">
            <div class="challenge-title">Weekly Challenge</div>
            <div class="divider green"></div>
            <button class="start-button">START</button>
          </div>
      </div>
      </div>


    </div>

    <!-- Your custom content -->
      <!-- Add whatever you want here -->
  </div>

  <script>
    let isLogin = true;

    const totalScore = localStorage.getItem("totalScore");
    document.querySelector('.score').textContent = `Score: ${totalScore}`;


    function toggleForm() {
      isLogin = !isLogin;
      document.getElementById('formTitle').innerText = isLogin ? 'Login' : 'Sign Up';
      document.querySelector('.switch').innerText = isLogin
        ? "Don't have an account? Sign up"
        : "Already have an account? Login";
    }

    function handleAuth() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        alert("Please enter both username and password.");
        return;
      }

      let users = JSON.parse(localStorage.getItem('users') || '{}');

      if (isLogin) {
        if (!users[username] || users[username] !== password) {
          alert("Invalid username or password.");
          return;
        }
        localStorage.setItem('loggedInUser', username);
        showHome(username);
      } else {
        if (users[username]) {
          alert("Username already exists.");
          return;
        }
        users[username] = password;
        localStorage.setItem('users', JSON.stringify(users));
        alert("Signup successful! Please log in.");
        toggleForm();
      }

      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
    }

    function showHome(username) {
      document.getElementById('authContainerWrapper').style.display = 'none';
      document.getElementById('homePage').style.display = 'block';
      document.body.style.background = "#ffffff";
      document.getElementById('displayUser').innerText = username;
    }

    function logout() {
      localStorage.removeItem('loggedInUser');
      document.getElementById('authContainerWrapper').style.display = 'flex';
      document.getElementById('homePage').style.display = 'none';
      document.body.style.background = "linear-gradient(135deg, #667eea, #764ba2)";
    }

    window.onload = () => {
      const username = localStorage.getItem('loggedInUser');
      if (username) showHome(username);
    };

    function play(){

      window.location.href = 'game.html';
    }
  </script>

</body>
</html>
